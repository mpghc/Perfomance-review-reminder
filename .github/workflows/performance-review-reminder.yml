name: Performance Review Reminder

on:
  # Run on the first Monday of each month at 9 AM UTC
  schedule:
    - cron: '0 9 1-7 * 1'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-reminder-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Performance Review Reminder Issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date();
            const month = date.toLocaleString('default', { month: 'long' });
            const year = date.getFullYear();
            
            const title = `📝 Performance Review Reminder - ${month} ${year}`;
            const body = `## Performance Review Reminder
            
            This is an automated reminder to conduct performance reviews for this period.
            
            ### Actions Required:
            - [ ] Schedule performance review meetings
            - [ ] Review employee goals and achievements
            - [ ] Prepare feedback and evaluations
            - [ ] Document review outcomes
            - [ ] Set goals for next review period
            
            ### Timeline:
            - **Review Period:** ${month} ${year}
            - **Due Date:** End of month
            
            ---
            *This issue was automatically created by the Performance Review Reminder Bot*
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['reminder', 'performance-review']
            });
            
            console.log(`Created issue: ${title}`);
